<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - OffrO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body {
    margin:0; min-height:100vh; display:flex;
    justify-content:center; align-items:center;
    font-family:'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1a3a32, #3E5F55, #A9CDBA);
    overflow-y:auto; overflow-x:hidden;
}
.bg-logo {
    position:absolute; width:420px; top:38%; left:50%;
    transform:translate(-50%,-50%); opacity:0.07; pointer-events:none;
}
.card {
    background:#FDFBF6; border-radius:20px;
    padding:44px 48px; width:420px;
    box-shadow:0 24px 60px rgba(0,0,0,0.3); z-index:2;
    text-align:center;
}
.logo-wrap { display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.logo-wrap img { height:130px; width:auto; max-width:100%; object-fit:contain; }
.logo-text { font-size:22px; font-weight:800; color:#3E5F55; }
.logo-sub { color:#6b8c7e; font-size:13px; margin-bottom:28px; }
.badge-admin {
    display:inline-block; background:#CDEBD6; color:#3E5F55;
    font-size:11px; font-weight:700; padding:4px 12px;
    border-radius:20px; margin-bottom:24px; letter-spacing:0.5px;
    text-transform:uppercase;
}
.form-label-custom { font-size:12px; font-weight:600; color:#6b8c7e; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; text-align:left; display:block; }
.form-control {
    border:1px solid #d4e8de; background:#fff; border-radius:10px;
    padding:10px 14px; font-size:14px; color:#2c3e35; width:100%;
}
.form-control:focus { border-color:#3E5F55; box-shadow:0 0 0 3px rgba(62,95,85,0.12); outline:none; }
.btn-main {
    background:#3E5F55; border:none; color:white; border-radius:10px;
    padding:12px; font-size:15px; font-weight:600; width:100%;
    cursor:pointer; transition:0.2s; margin-top:6px;
}
.btn-main:hover { background:#2d4a42; }
.btn-main:disabled { opacity:0.5; cursor:not-allowed; }
#msg { color:#c0392b; font-size:13px; min-height:18px; margin-top:10px; }
.pin-wrap { position:relative; }
.pin-wrap .eye-btn {
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#6b8c7e; cursor:pointer; font-size:16px;
}
.hint { color:#6b8c7e; font-size:11px; margin-top:6px; }

/* ── OTP Screen ── */
.otp-screen { display:none; }
.otp-icon {
    width:64px; height:64px; border-radius:50%;
    background:#CDEBD6; color:#3E5F55;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; margin:0 auto 16px;
}
.otp-inputs { display:flex; gap:10px; justify-content:center; margin:20px 0; }
.otp-box {
    width:52px; height:60px; text-align:center;
    font-size:24px; font-weight:700; color:#3E5F55;
    border:2px solid #d4e8de; border-radius:12px;
    background:#fff; outline:none;
    transition:border-color 0.2s;
}
.otp-box:focus { border-color:#3E5F55; box-shadow:0 0 0 3px rgba(62,95,85,0.12); }
.otp-box.filled { border-color:#3E5F55; background:#f0faf4; }
.otp-info { color:#6b8c7e; font-size:13px; margin-bottom:16px; }
.otp-info strong { color:#3E5F55; }
.resend-btn {
    background:none; border:none; color:#3E5F55;
    font-size:13px; font-weight:600; cursor:pointer;
    padding:8px; text-decoration:underline;
}
.resend-btn:disabled { color:#6b8c7e; opacity:0.6; cursor:not-allowed; text-decoration:none; }
.trust-check {
    display:flex; align-items:center; gap:8px; justify-content:center;
    margin:16px 0; font-size:13px; color:#6b8c7e;
}
.trust-check input { width:18px; height:18px; accent-color:#3E5F55; cursor:pointer; }
.back-btn {
    background:none; border:none; color:#6b8c7e;
    font-size:13px; cursor:pointer; margin-top:12px;
}
.back-btn:hover { color:#3E5F55; }
.otp-timer { font-size:12px; color:#6b8c7e; margin-top:8px; }
</style>
</head>
<body>

<!-- Watermark -->
<img class="bg-logo" src="https://base44.app/api/apps/69dc008cb5876dcb8680be38/files/mp/public/69dc008cb5876dcb8680be38/a8944778c_offro_logo_transparent.png" alt="" style="width:460px;height:auto;object-fit:contain;">

<!-- ═══ Step 1: Login (Mobile + PIN) ═══ -->
<div class="card" id="loginCard">
    <div class="logo-wrap">
        <img src="https://base44.app/api/apps/69dc008cb5876dcb8680be38/files/mp/public/69dc008cb5876dcb8680be38/a8944778c_offro_logo_transparent.png" alt="OffrO">
    </div>
    <div class="logo-sub">Administration Portal</div>
    <div class="badge-admin">🔒 Restricted Access</div>

    <div class="mb-3 text-start">
        <label class="form-label-custom">Mobile Number</label>
        <input id="mobile" class="form-control" placeholder="e.g. 9999999999" maxlength="10" inputmode="numeric" autocomplete="off" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
    </div>
    <div class="mb-3 text-start">
        <label class="form-label-custom">PIN</label>
        <div class="pin-wrap">
            <input id="pin" type="password" class="form-control" placeholder="4 or 6 digit PIN" maxlength="6" inputmode="numeric" pattern="[0-9]*">
            <button class="eye-btn" onclick="togglePin()" tabindex="-1"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
        <div class="hint">Enter your 4 or 6 digit security PIN</div>
    </div>
    <button class="btn-main" id="loginBtn" onclick="login()">
        <i class="fas fa-sign-in-alt me-1"></i> Login to Dashboard
    </button>
    <p id="msg" class="mt-3 mb-0"></p>
</div>

<!-- ═══ Step 2: OTP Verification ═══ -->
<div class="card otp-screen" id="otpCard">
    <div class="logo-wrap">
        <img src="https://base44.app/api/apps/69dc008cb5876dcb8680be38/files/mp/public/69dc008cb5876dcb8680be38/a8944778c_offro_logo_transparent.png" alt="OffrO">
    </div>
    <div class="logo-sub">Verify your identity with 2FA</div>

    <div class="otp-icon">
        <i class="fas fa-shield-alt"></i>
    </div>
    <p class="otp-info">
        A <strong>4-digit OTP</strong> has been sent to<br>
        <strong id="otpMobileDisplay">your mobile number</strong>
    </p>

    <div class="otp-inputs" id="otpInputs">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-index="0" oninput="onOtpInput(this)" onkeydown="onOtpKeydown(event,this)">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-index="1" oninput="onOtpInput(this)" onkeydown="onOtpKeydown(event,this)">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-index="2" oninput="onOtpInput(this)" onkeydown="onOtpKeydown(event,this)">
        <input type="text" class="otp-box" maxlength="1" inputmode="numeric" data-index="3" oninput="onOtpInput(this)" onkeydown="onOtpKeydown(event,this)">
    </div>

    <div class="trust-check">
        <input type="checkbox" id="trustDevice">
        <label for="trustDevice" style="cursor:pointer;margin:0;">Trust this device for 30 days</label>
    </div>

    <button class="btn-main" id="verifyBtn" onclick="verifyOtp()">
        <i class="fas fa-check-circle me-1"></i> Verify & Login
    </button>

    <p id="otpMsg" class="mt-3 mb-0"></p>

    <div style="margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <button class="resend-btn" id="resendBtn" onclick="resendOtp()" disabled>
            <i class="fas fa-redo me-1"></i> Resend OTP <span id="resendTimer"></span>
        </button>
        <button class="back-btn" onclick="backToLogin()">
            <i class="fas fa-arrow-left me-1"></i> Back to Login
        </button>
    </div>
</div>

<script>
// ── MSG91 Widget credentials (same as Flutter app) ──────────────────────────
const MSG91_WIDGET_ID   = '36656f6a786e313430373338';
const MSG91_TOKEN_AUTH  = '516819TuGI7seX6a06f51cP1';
const MSG91_WIDGET_BASE = 'https://control.msg91.com/api/v5/widget';

let _loginMobile = "";
let _loginPin = "";
let _resendCountdown = 0;
let _resendInterval = null;
let _msg91ReqId = "";   // ★ MSG91 widget returns this from sendOtpMobile — REQUIRED for verifyOtp/retryOtp

// ─── MSG91 Widget API calls (identical to Flutter SDK) ───────────────────────
async function msg91SendOTP(mobile) {
    // mobile must be "91XXXXXXXXXX" format
    const phone = mobile.startsWith("91") ? mobile : "91" + mobile;
    const resp = await fetch(MSG91_WIDGET_BASE + '/sendOtpMobile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ widgetId: MSG91_WIDGET_ID, tokenAuth: MSG91_TOKEN_AUTH, identifier: phone })
    });
    const data = await resp.json();
    // MSG91 returns the reqId in the "message" field on success — store it for verify/retry
    if (data && (data.type === "success" || data.message)) {
        _msg91ReqId = data.message || data.reqId || "";
    }
    console.log('[MSG91 sendOtpMobile] reqId captured:', _msg91ReqId);
    return data;
}

async function msg91RetryOTP(mobile) {
    const phone = mobile.startsWith("91") ? mobile : "91" + mobile;
    // Include widgetId + tokenAuth + identifier ALONGSIDE reqId — all are required together
    const resp = await fetch(MSG91_WIDGET_BASE + '/retryOtp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            widgetId: MSG91_WIDGET_ID, tokenAuth: MSG91_TOKEN_AUTH,
            identifier: phone, reqId: _msg91ReqId, retryChannel: 'text'
        })
    });
    const data = await resp.json();
    // retryOtp may issue a fresh reqId — update it
    if (data && data.message) {
        _msg91ReqId = data.message || _msg91ReqId;
    }
    console.log('[MSG91 retryOtp] reqId now:', _msg91ReqId);
    return data;
}

async function msg91VerifyOTP(mobile, otp) {
    const phone = mobile.startsWith("91") ? mobile : "91" + mobile;
    // Include widgetId + tokenAuth + identifier ALONGSIDE reqId — all are required together
    const resp = await fetch(MSG91_WIDGET_BASE + '/verifyOtp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            widgetId: MSG91_WIDGET_ID, tokenAuth: MSG91_TOKEN_AUTH,
            identifier: phone, reqId: _msg91ReqId, otp: otp
        })
    });
    return await resp.json();
}

// ═══ Step 1: Login ═══
async function login() {
    let mobile = document.getElementById("mobile").value.trim();
    let pin    = document.getElementById("pin").value.trim();
    let msgEl  = document.getElementById("msg");
    let btn    = document.getElementById("loginBtn");

    if (!mobile || !pin) { msgEl.innerText = "Please enter mobile number and PIN"; return; }
    if (!/^\d{10}$/.test(mobile)) { msgEl.innerText = "Mobile number must be exactly 10 digits"; return; }
    if (!/^\d{4}$|^\d{6}$/.test(pin)) { msgEl.innerText = "PIN must be 4 or 6 digits"; return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Verifying...';
    msgEl.innerText = "";

    try {
        // Step 1a: Validate credentials with backend
        let res = await fetch("/admin/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobile, pin }),
            credentials: "include"
        });
        let data = await res.json();

        if (!res.ok) {
            msgEl.innerText = data.detail || "Login failed";
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login to Dashboard';
            return;
        }

        // Trusted device — skip OTP
        if (!data.otp_required) {
            btn.innerHTML = '<i class="fas fa-check me-1"></i> Welcome, ' + (data.user ? data.user.full_name : 'Admin') + '!';
            setTimeout(() => { window.location.href = "/admin/dashboard"; }, 600);
            return;
        }

        // Step 1b: Credentials valid — now send OTP via MSG91 Widget (same as Flutter)
        _loginMobile = mobile;
        _loginPin    = pin;

        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Sending OTP...';

        let otpRes = await msg91SendOTP(mobile);
        console.log('[MSG91 sendOTP]', otpRes);

        // Show OTP screen regardless of MSG91 response
        // (MSG91 returns success on first call)
        document.getElementById("otpMobileDisplay").innerText = "+91 " + mobile;
        showOtpScreen();
        startResendCountdown(30);

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login to Dashboard';
    } catch (err) {
        msgEl.innerText = "Server error. Please try again.";
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Login to Dashboard';
    }
}

// ═══ Step 2: OTP Verification ═══
function showOtpScreen() {
    document.getElementById("loginCard").style.display = "none";
    document.getElementById("otpCard").style.display = "block";
    setTimeout(() => {
        let first = document.querySelector(".otp-box[data-index='0']");
        if (first) first.focus();
    }, 100);
}

function backToLogin() {
    document.getElementById("otpCard").style.display = "none";
    document.getElementById("loginCard").style.display = "block";
    document.querySelectorAll(".otp-box").forEach(b => { b.value = ""; b.classList.remove("filled"); });
    document.getElementById("otpMsg").innerText = "";
    if (_resendInterval) { clearInterval(_resendInterval); _resendInterval = null; }
}

function onOtpInput(el) {
    el.value = el.value.replace(/[^0-9]/g, "");
    if (el.value) {
        el.classList.add("filled");
        let idx = parseInt(el.dataset.index);
        let next = document.querySelector(".otp-box[data-index='" + (idx + 1) + "']");
        if (next) next.focus();
        if (idx === 3) {
            let allFilled = true;
            document.querySelectorAll(".otp-box").forEach(b => { if (!b.value) allFilled = false; });
            if (allFilled) verifyOtp();
        }
    } else {
        el.classList.remove("filled");
    }
}

function onOtpKeydown(e, el) {
    let idx = parseInt(el.dataset.index);
    if (e.key === "Backspace" && !el.value && idx > 0) {
        let prev = document.querySelector(".otp-box[data-index='" + (idx - 1) + "']");
        if (prev) { prev.focus(); prev.value = ""; prev.classList.remove("filled"); }
    }
    if (e.key === "ArrowLeft" && idx > 0) {
        let prev = document.querySelector(".otp-box[data-index='" + (idx - 1) + "']");
        if (prev) prev.focus();
    }
    if (e.key === "ArrowRight") {
        let next = document.querySelector(".otp-box[data-index='" + (idx + 1) + "']");
        if (next) next.focus();
    }
    if (e.key === "Enter") { e.preventDefault(); verifyOtp(); }
}

function getOtpValue() {
    let otp = "";
    document.querySelectorAll(".otp-box").forEach(b => { otp += b.value; });
    return otp;
}

async function verifyOtp() {
    let otp   = getOtpValue();
    let msgEl = document.getElementById("otpMsg");
    let btn   = document.getElementById("verifyBtn");

    if (otp.length !== 4) {
        msgEl.innerText = "Please enter all 4 digits";
        msgEl.style.color = "#c0392b";
        return;
    }

    let trustDevice = document.getElementById("trustDevice").checked;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Verifying...';
    msgEl.innerText = "";

    try {
        // Step 2a: Verify OTP directly with MSG91 Widget
        let m91 = await msg91VerifyOTP(_loginMobile, otp);
        console.log('[MSG91 verifyOtp]', m91);

        const m91Type = (m91.type || m91.message_type || "").toLowerCase();
        const m91Ok   = m91Type === "success" || m91.success === true || m91.status === "success";

        if (!m91Ok) {
            let errMsg = m91.message || m91.msg || m91.error || "Invalid OTP. Please try again.";
            msgEl.innerText = errMsg;
            msgEl.style.color = "#c0392b";
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Verify & Login';
            document.querySelectorAll(".otp-box").forEach(b => { b.value = ""; b.classList.remove("filled"); });
            let first = document.querySelector(".otp-box[data-index='0']");
            if (first) first.focus();
            return;
        }

        // Step 2b: MSG91 verified — now complete session with backend
        let res = await fetch("/admin/auth/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobile: _loginMobile, otp: otp, trust_device: trustDevice, msg91_verified: true }),
            credentials: "include"
        });
        let data = await res.json();

        if (!res.ok) {
            msgEl.innerText = data.detail || "Verification failed";
            msgEl.style.color = "#c0392b";
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Verify & Login';
            return;
        }

        btn.innerHTML = '<i class="fas fa-check me-1"></i> Welcome, ' + (data.user ? data.user.full_name : 'Admin') + '!';
        setTimeout(() => { window.location.href = "/admin/dashboard"; }, 600);
    } catch (err) {
        console.error('[verifyOtp error]', err);
        msgEl.innerText = "Error verifying OTP. Please try again.";
        msgEl.style.color = "#c0392b";
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Verify & Login';
    }
}

// ═══ Resend OTP ═══
async function resendOtp() {
    let msgEl = document.getElementById("otpMsg");
    let btn   = document.getElementById("resendBtn");
    btn.disabled = true;

    try {
        let res = await msg91RetryOTP(_loginMobile);
        console.log('[MSG91 retryOtp]', res);

        document.querySelectorAll(".otp-box").forEach(b => { b.value = ""; b.classList.remove("filled"); });
        let first = document.querySelector(".otp-box[data-index='0']");
        if (first) first.focus();

        msgEl.innerText = "OTP resent successfully";
        msgEl.style.color = "#3E5F55";
        setTimeout(() => { msgEl.innerText = ""; }, 3000);

        startResendCountdown(30);
    } catch (err) {
        msgEl.innerText = "Resend failed. Please try again.";
        msgEl.style.color = "#c0392b";
        btn.disabled = false;
    }
}

function startResendCountdown(seconds) {
    _resendCountdown = seconds;
    let btn     = document.getElementById("resendBtn");
    let timerEl = document.getElementById("resendTimer");
    btn.disabled = true;
    if (_resendInterval) clearInterval(_resendInterval);
    _resendInterval = setInterval(() => {
        if (_resendCountdown > 0) {
            timerEl.innerText = "(" + _resendCountdown + "s)";
            _resendCountdown--;
        } else {
            clearInterval(_resendInterval);
            _resendInterval = null;
            timerEl.innerText = "";
            btn.disabled = false;
        }
    }, 1000);
}

function togglePin() {
    let inp  = document.getElementById("pin");
    let icon = document.getElementById("eyeIcon");
    if (inp.type === "password") {
        inp.type = "text";
        icon.className = "fas fa-eye-slash";
    } else {
        inp.type = "password";
        icon.className = "fas fa-eye";
    }
}

document.addEventListener("keydown", e => {
    let loginCard = document.getElementById("loginCard");
    if (e.key === "Enter" && loginCard.style.display !== "none") { login(); }
});

document.getElementById("mobile").focus();
</script>

</body>
</html>
